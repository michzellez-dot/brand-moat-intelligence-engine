name: Automated Brand Moat Pipeline

on:
  schedule:
    # Runs automatically every Sunday at 00:00 UTC (Midnight)
    - cron: '0 0 * * 0'
  # Allows you to manually trigger the pipeline anytime via a button in GitHub
  workflow_dispatch:

permissions:
  contents: write  # Grants permission to commit and push updated charts back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Run End-to-End Pipeline
        run: python main.py

      - name: Commit and push updated artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add brand_moat_chart.png brand_moat_summary.csv reddit_brand_comments_classified.csv reddit_brand_comments.csv
          git commit -m "chore: auto-update brand moat metrics and chart [skip ci]" || echo "No changes to commit"
          git push
